# auto-arXiv: Daily pipeline (GitHub Actions)
# Runs every day at 02:00 UTC = 10:00 Beijing time
name: Daily arXiv Pipeline

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install
        run: pip install -r requirements.txt

      - name: Run
        env:
          ARXIV_LLM_API_KEY: ${{ secrets.ARXIV_LLM_API_KEY }}
          ARXIV_LLM_MODEL: ${{ secrets.ARXIV_LLM_MODEL }}
          ARXIV_LLM_BASE_URL: ${{ secrets.ARXIV_LLM_BASE_URL }}
          ARXIV_RESEARCH_DESCRIPTION: ${{ secrets.ARXIV_RESEARCH_DESCRIPTION }}
          ARXIV_CATEGORIES: ${{ secrets.ARXIV_CATEGORIES }}
          ARXIV_EMAIL_ENABLED: ${{ secrets.ARXIV_EMAIL_ENABLED }}
          ARXIV_EMAIL_SMTP_SERVER: ${{ secrets.ARXIV_EMAIL_SMTP_SERVER }}
          ARXIV_EMAIL_SMTP_PORT: ${{ secrets.ARXIV_EMAIL_SMTP_PORT }}
          ARXIV_EMAIL_USE_SSL: ${{ secrets.ARXIV_EMAIL_USE_SSL }}
          ARXIV_EMAIL_SENDER: ${{ secrets.ARXIV_EMAIL_SENDER }}
          ARXIV_EMAIL_PASSWORD: ${{ secrets.ARXIV_EMAIL_PASSWORD }}
          ARXIV_EMAIL_RECEIVER: ${{ secrets.ARXIV_EMAIL_RECEIVER }}
        run: python -m auto_arxiv.main

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
          retention-days: 7
